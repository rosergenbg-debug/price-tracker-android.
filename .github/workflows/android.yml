name: Gold & Silver Checker Android build
on:
  push:
    branches: [ 'agent/gold-silver-price-checker' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand full Android source and publish readable files
        run: |
          if [ -f project-source.txz ]; then
            tar -xJf project-source.txz
            # Keep the current workflow unchanged so GitHub Actions can publish app source without workflow write permission.
            git checkout -- .github/workflows/android.yml
            rm project-source.txz
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m 'Expand standalone Gold & Silver Android project'
              git push origin HEAD:${GITHUB_REF_NAME} || echo 'Could not publish unpacked files, but this build has source'
            fi
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK is ready
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build prototype
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GoldSilverChecker-prototype-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Sign release with owner-owned private key (optional)
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          gradle --no-daemon assembleRelease
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$TOOLS/apksigner" sign --ks release.jks --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out GoldSilverChecker-signed.apk aligned.apk
          "$TOOLS/apksigner" verify GoldSilverChecker-signed.apk
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_SIGNING == 'true' }}
        with:
          name: GoldSilverChecker-release-signed-APK
          path: GoldSilverChecker-signed.apk