name: Build Gold & Silver Checker
on:
  push:
    branches: [ 'agent/gold-silver-price-checker' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build installable prototype APK
        run: gradle --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: GoldSilverChecker-prototype-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Upload unsigned release for private offline signing
        uses: actions/upload-artifact@v4
        with:
          name: GoldSilverChecker-unsigned-release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
      - name: Build updateable release APK (when signing secrets exist)
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          gradle --no-daemon assembleRelease
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$TOOLS/apksigner" sign --ks release.jks --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out GoldSilverChecker-signed.apk aligned.apk
          "$TOOLS/apksigner" verify GoldSilverChecker-signed.apk
        # The signed APK uses the same user-owned keystore on every version.
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_SIGNING == 'true' }}
        with:
          name: GoldSilverChecker-release-signed-APK
          path: GoldSilverChecker-signed.apk