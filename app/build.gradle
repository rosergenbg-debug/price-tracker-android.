plugins { id 'com.android.application' }

android {
    namespace 'com.rosergenbg.goldchecker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rosergenbg.goldchecker'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.1.1'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}