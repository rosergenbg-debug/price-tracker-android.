plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.example.pricetracker'
    compileSdk 34
    defaultConfig { applicationId "com.example.pricetracker"; minSdk 24; targetSdk 34; versionCode 18; versionName "3.4" }
    signingConfigs {
        release {
            // GitHub secret must be configured before a genuinely signed release build.
            def location = System.getenv("PRICE_MONITOR_KEYSTORE_PATH")
            def password = System.getenv("PRICE_MONITOR_KEYSTORE_PASSWORD")
            if (location && password) {
                storeFile file(location)
                storePassword password
                keyAlias 'pricemonitor-release'
                keyPassword password
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("PRICE_MONITOR_KEYSTORE_PATH") && System.getenv("PRICE_MONITOR_KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
